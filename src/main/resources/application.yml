spring:
  application:
    name: data-sync-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5432/orchestrator
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  server:
    port: 8080

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,loggers,env
